name: 💡 Proposer une fonctionnalité
description: Suggérer une nouvelle fonctionnalité ou une amélioration.
title: "[Feature] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de proposer une amélioration. Avant de soumettre, vérifiez qu'aucune [demande similaire](../search?type=issues) n'existe déjà.

  - type: checkboxes
    id: prerequis
    attributes:
      label: Pré-requis
      options:
        - label: J'ai vérifié qu'aucune demande similaire n'existe déjà
          required: true
        - label: Cette demande s'inscrit dans la portée du projet (README)
          required: true

  - type: textarea
    id: probleme
    attributes:
      label: Problème ou besoin
      description: Quel problème cette fonctionnalité résout-elle ? Quel besoin couvre-t-elle ?
      placeholder: Aujourd'hui, je ne peux pas... et cela m'empêche de...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Solution proposée
      description: Décrivez clairement ce que vous aimeriez voir implémenté.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considérées
      description: Quelles autres approches avez-vous envisagées ? Pourquoi celle-ci est meilleure ?
    validations:
      required: false

  - type: dropdown
    id: priorite
    attributes:
      label: Importance pour vous
      options:
        - Bloquant — je ne peux pas avancer sans
        - Important — contournement coûteux
        - Confort — amélioration agréable
        - Idée — pour discussion
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: Êtes-vous prêt à contribuer ?
      options:
        - label: Je peux ouvrir une PR pour implémenter cette fonctionnalité
        - label: Je peux aider à tester et donner du feedback
        - label: Je préfère que quelqu'un d'autre s'en charge

  - type: textarea
    id: contexte
    attributes:
      label: Contexte additionnel
      description: Liens, références, exemples d'autres projets, maquettes, etc.
    validations:
      required: false
